name: Ubuntu RDP via bore

on:
  workflow_dispatch:
    inputs:
      username:
        description: "RDP username"
        required: true
        default: "myuser"
      password:
        description: "RDP password"
        required: true
        default: "admin"

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install desktop and xrdp
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11

      - name: Create RDP user
        env:
          RDP_USER: ${{ inputs.username }}
          RDP_PASS: ${{ inputs.password }}
        run: |
          sudo useradd -m -s /bin/bash "$RDP_USER"
          echo "$RDP_USER:$RDP_PASS" | sudo chpasswd
          sudo usermod -aG sudo "$RDP_USER"
          echo "xfce4-session" | sudo tee "/home/$RDP_USER/.xsession"
          sudo chown "$RDP_USER:$RDP_USER" "/home/$RDP_USER/.xsession"
          sudo adduser xrdp ssl-cert

      - name: Start xrdp
        run: |
          sudo systemctl enable --now xrdp

      - name: Install bore
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv bore /usr/local/bin/

      - name: Expose RDP with bore
        run: timeout 340m bore local 3389 --to bore.pub

name: BlissOS via bore

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "رابط تحميل مباشر لملف BlissOS ISO"
        required: true
      vnc_password:
        description: "كلمة سر VNC (8 أحرف كحد أقصى)"
        required: true
        default: "admin"

jobs:
  bliss:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 socat
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download BlissOS
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: wget -q -L -O bliss.iso "$ISO_URL" && ls -lh bliss.iso

      - name: Start VM
        env:
          VNC_PASS: ${{ inputs.vnc_password }}
        run: |
          qemu-img create -f qcow2 disk.qcow2 16G
          nohup qemu-system-x86_64 \
            -enable-kvm -cpu host -smp 4 -m 6144 \
            -cdrom bliss.iso -drive file=disk.qcow2,if=virtio -boot d \
            -vga std -device usb-ehci -device usb-tablet \
            -nic user,model=virtio-net-pci \
            -vnc 127.0.0.1:0,password=on \
            -monitor unix:/tmp/qemu-mon,server,nowait > qemu.log 2>&1 &
          sleep 5
          echo "set_password vnc $VNC_PASS" | socat - UNIX-CONNECT:/tmp/qemu-mon
          cat qemu.log

      - name: Install bore
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv bore /usr/local/bin/

      - name: Expose VNC with bore
        run: timeout 340m bore local 5900 --to bore.pub
